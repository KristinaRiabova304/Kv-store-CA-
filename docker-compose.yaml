# Локальний запуск: coordinator і 2 шарди.
#   docker compose up --build
#   curl localhost:8080/internal/shards
services:
  coordinator:
    build: .
    command: ["coordinator"]
    ports: ["8080:8080"]
    environment:
      EXPECTED_SHARDS: "2"

  shard-1:
    build: .
    command: ["shard"]
    environment:
      SHARD_ID: shard-1
      ADVERTISE_ADDR: shard-1:9090
      COORDINATOR_URL: http://coordinator:8081
    depends_on: [coordinator]

  shard-2:
    build: .
    command: ["shard"]
    environment:
      SHARD_ID: shard-2
      ADVERTISE_ADDR: shard-2:9090
      COORDINATOR_URL: http://coordinator:8081
    depends_on: [coordinator]
